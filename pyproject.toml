[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-voice-assistant"
version = "1.0.0"
description = "Realtime voice assistant that runs fully offline: streaming speech-to-text, intent routing with memory, interruptible text-to-speech with barge-in, and a 500 ms time-to-first-audio latency budget. No microphone, network or API key needed."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Murtaza Mahboob" }]
keywords = [
    "voice-assistant",
    "realtime-voice-agent",
    "speech-to-text",
    "text-to-speech",
    "barge-in",
    "voice-activity-detection",
    "offline-ai",
    "conversational-ai",
    "python",
    "numpy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy==1.26.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
voiceassist = "voiceassist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
